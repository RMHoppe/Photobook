<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobook Editor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span class="app-title">Photobook</span>
      <div class="toolbar-actions">
        <button id="btn-add-spread" title="Add spread">+ Spread</button>
        <button id="btn-add-text" title="Add text element">+ Text</button>
        <button id="btn-cut-tool" title="Cut tool (X)">&#9986; Cut</button>
        <button id="btn-export-pdf" title="Export PDF">Export PDF</button>
        <div id="export-progress" class="export-progress" hidden>
          <div class="export-progress-bar"></div>
        </div>
      </div>
      <div class="toolbar-right">
        <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>↺ Undo</button>
        <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>↻ Redo</button>
        <button id="btn-debug-dump" title="Export PSLG debug dump">Debug</button>
        <button id="btn-docs" title="Documentation">? Docs</button>
        <button id="btn-project-settings" title="Project settings" class="icon-btn">&#9881;</button>
      </div>
    </header>

    <div id="workspace">
      <!-- Left sidebar: image browser -->
      <aside id="sidebar-left">
        <div class="sidebar-header">
          <button id="btn-open-folder">Open Folder</button>
        </div>
        <div id="image-grid"></div>
      </aside>

      <!-- Main canvas area -->
      <main id="canvas-area">
        <div id="canvas-wrapper">
          <canvas id="main-canvas"></canvas>
        </div>
        <div id="zoom-controls">
          <button id="btn-zoom-out" title="Zoom out">−</button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-in" title="Zoom in">+</button>
          <button id="btn-zoom-fit" title="Fit to window">Fit</button>
        </div>
      </main>

      <!-- Right sidebar: box model editor / project settings -->
      <aside id="sidebar-right">
        <div id="sidebar-right-header" class="sidebar-header">Project Settings</div>
        <div id="box-model-editor">
          <div id="panel-face"></div>
          <div id="panel-text"></div>
          <div id="panel-divider"></div>
          <div id="panel-photo"></div>
          <div id="panel-project"><p class="no-selection">Select a frame to edit</p></div>
        </div>
      </aside>
    </div>

    <!-- Footer: page switcher -->
    <footer id="footer">
      <button id="btn-prev-spread" title="Previous spread">&#8592;</button>
      <div id="spread-thumbnails"></div>
      <button id="btn-next-spread" title="Next spread">&#8594;</button>
    </footer>
  </div>

  <dialog id="project-settings-modal" class="ps-modal">
    <div class="ps-modal-header">
      <h2>Project Settings</h2>
      <button id="btn-psm-close" class="docs-close" title="Close">&#x2715;</button>
    </div>
    <div id="psm-content" class="ps-modal-content"></div>
  </dialog>

  <dialog id="docs-modal" class="docs-modal">
    <div class="docs-modal-inner">
      <nav id="docs-nav" class="docs-nav"></nav>
      <div id="docs-content" class="docs-content"></div>
    </div>
    <button id="docs-close" class="docs-close" title="Close">✕</button>
  </dialog>

  <script type="importmap">
    { "imports": { "marked": "./lib/marked.esm.js" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
