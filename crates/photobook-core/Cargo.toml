[package]
name = "photobook-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for the Photobook editor: Coincident-Edge Grid layout, PDF/X-4 export, compiled to WebAssembly"
repository = "https://github.com/RMHoppe/Photobook"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wasm-bindgen   = "0.2"
js-sys         = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
base64         = "0.22"
console_error_panic_hook = { version = "0.1", optional = true }

# PDF pipeline
printpdf       = { version = "0.7", features = ["embedded_images"] }
image          = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder   = "0.3"
moxcms        = { version = "0.8.1", default-features = false, features = ["lut"] }
# lopdf (PDF streams) and png (decode) both go through flate2; zlib-rs is a
# pure-Rust backend that is markedly faster than the default miniz_oxide.
flate2         = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
png = "0.17"

[features]
default = ["console_error_panic_hook", "wasm-test"]
wasm-test = ["console_error_panic_hook"]

# wasm-opt trims ~1.2 MB (strips the debug name section, then -Oz). The two
# --enable flags match the features rustc already emits for wasm32.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
