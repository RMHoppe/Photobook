name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build WASM
        run: |
          cargo build --lib --target wasm32-unknown-unknown --release -p photobook-core
          WBVER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBVER}/wasm-bindgen-${WBVER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          cp "/tmp/wasm-bindgen-${WBVER}-x86_64-unknown-linux-musl/wasm-bindgen" ~/.cargo/bin/
          mkdir -p web/pkg
          wasm-bindgen --out-dir web/pkg --target web target/wasm32-unknown-unknown/release/photobook_core.wasm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc

      - name: Copy vendor libs
        run: |
          mkdir -p web/lib
          cp node_modules/marked/lib/marked.esm.js web/lib/marked.esm.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
