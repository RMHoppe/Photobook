name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build WASM
        run: |
          cargo build --lib --target wasm32-unknown-unknown --release -p photobook-core
          WBVER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBVER}/wasm-bindgen-${WBVER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          cp "/tmp/wasm-bindgen-${WBVER}-x86_64-unknown-linux-musl/wasm-bindgen" ~/.cargo/bin/
          mkdir -p web/pkg
          wasm-bindgen --out-dir web/pkg --target web target/wasm32-unknown-unknown/release/photobook_core.wasm

      # Mirrors [package.metadata.wasm-pack.profile.release] wasm-opt in
      # crates/photobook-core/Cargo.toml — keep the flags in sync.
      #
      # Binaryen is fetched from GitHub Releases, not apt: Ubuntu's package is
      # version 108, which mis-renumbers wasm-bindgen's tables so that the
      # `__wbindgen_externrefs` export ends up pointing at the fixed-size funcref
      # table and `table.grow()` fails at startup in every browser
      # (WebAssembly/binaryen#4711, fixed in 109).
      - name: Optimize WASM
        run: |
          BINARYEN=version_132
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          WASM_OPT="/tmp/binaryen-${BINARYEN}/bin/wasm-opt"
          "$WASM_OPT" --version
          "$WASM_OPT" -Oz --enable-bulk-memory --enable-nontrapping-float-to-int \
            web/pkg/photobook_core_bg.wasm -o web/pkg/photobook_core_bg.wasm
          ls -l web/pkg/photobook_core_bg.wasm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc

      # Instantiate the optimized module once: a broken wasm-opt (see above)
      # produces a file that is valid Wasm but throws in `init()`.
      - name: Smoke-test WASM
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const m = await import("./web/pkg/photobook_core.js");
            m.initSync({ module: fs.readFileSync("web/pkg/photobook_core_bg.wasm") });
            console.log("wasm init ok");
          '

      - name: Copy vendor libs
        run: |
          mkdir -p web/lib
          cp node_modules/marked/lib/marked.esm.js web/lib/marked.esm.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
